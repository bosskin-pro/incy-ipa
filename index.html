<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INCY</title>
<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
body {
    margin: 0;
    min-height: 100vh;
    background: #f5f5f7;
    color: #111;
    font-family: -apple-system, BlinkMacSystemFont,
                 "SF Pro Display", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.container {
    width: 100%;
    max-width: 420px;
}
.card {
    background: #fff;
    border-radius: 28px;
    padding: 30px 24px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.06);
}
.icon {
    width: 100px;
    height: 100px;
    border-radius: 25px;
    margin: 0 auto 22px;
    background: #111;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 35px;
    font-weight: 800;
    letter-spacing: -2px;
    box-shadow: 0 8px 22px rgba(0,0,0,.15);
}
h1 {
    font-size: 29px;
    margin: 0 0 8px;
    letter-spacing: -1px;
}
.subtitle {
    color: #8e8e93;
    font-size: 15px;
    margin-bottom: 25px;
}
.info {
    background: #f5f5f7;
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 20px;
    text-align: left;
}
.info-row {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    font-size: 14px;
}
.label {
    color: #8e8e93;
}
.value {
    font-weight: 600;
}
.install {
    display: block;
    background: #111;
    color: #fff;
    text-decoration: none;
    padding: 17px;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 700;
    transition: .15s;
}
.install:active {
    transform: scale(.98);
    opacity: .8;
}
.note {
    margin-top: 18px;
    color: #8e8e93;
    font-size: 13px;
    line-height: 1.5;
}
.footer {
    text-align: center;
    color: #aaa;
    font-size: 12px;
    margin-top: 22px;
}
</style>
</head>
<body>
<div class="container">
<div class="card">
    <div class="icon">INCY</div>
    <h1>INCY</h1>
    <div class="subtitle">
        Версия 2.7.4
    </div>
    <div class="info">
        <div class="info-row">
            <span class="label">Приложение</span>
            <span class="value">INCY</span>
        </div>
        <div class="info-row">
            <span class="label">Версия</span>
            <span class="value">2.7.4</span>
        </div>
        <div class="info-row">
            <span class="label">Build</span>
            <span class="value">2111261554</span>
        </div>
    </div>
    <a
        class="install"
        href="itms-services://?action=download-manifest&url=https://bosskin-pro.github.io/incy-ipa/manifest.plist"
    >
        Установить приложение
    </a>
    <div class="note">
        Откройте страницу с iPhone или iPad
        и нажмите кнопку установки.
    </div>
</div>
<div class="footer">
    BOSSKIN
</div>
</div>
</body>
</html>
